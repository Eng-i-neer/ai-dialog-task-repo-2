            createNodeElement(node) {
                try {
                    console.log('createNodeElement called for:', node);
                    
                    const div = document.createElement('div');
                    div.className = `node ${this.selectedNodeId === node.id ? 'selected' : ''}`;
                    div.style.left = `${node.x}px`;
                    div.style.top = `${node.y}px`;
                    div.dataset.nodeId = node.id;
                    
                    console.log('Created div:', div.outerHTML);
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = `node-checkbox ${node.checked ? 'checked' : ''}`;
                    checkbox.checked = node.checked;
                    checkbox.addEventListener('change', (e) => {
                        e.stopPropagation();
                        this.toggleNodeChecked(node.id);
                    });
                    
                    const content = document.createElement('div');
                    content.className = 'node-content';
                    content.textContent = node.text;
                    content.contentEditable = 'true';
                    content.style.fontFamily = this.fontFamily;
                    content.style.fontSize = '16px';
                    
                    content.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        this.editingNodeId = node.id;
                        this.selectedNodeId = node.id;
                        
                        setTimeout(() => {
                            try {
                                content.focus();
                                const range = document.createRange();
                                range.selectNodeContents(content);
                                const selection = window.getSelection();
                                selection.removeAllRanges();
                                selection.addRange(range);
                            } catch (error) {
                                console.error('Error in dblclick focus:', error);
                            }
                        }, 10);
                    });
                    
                    content.addEventListener('click', (e) => {
                        if (this.editingNodeId !== node.id) {
                            e.stopPropagation();
                            this.editingNodeId = node.id;
                            this.selectedNodeId = node.id;
                        }
                    });
                    
                    content.addEventListener('focus', (e) => {
                        this.editingNodeId = node.id;
                        this.selectedNodeId = node.id;
                    });
                    
                    content.addEventListener('blur', (e) => {
                        if (e.target.textContent !== node.text) {
                            this.updateNodeText(node.id, e.target.textContent);
                        } else {
                            this.editingNodeId = null;
                        }
                    });
                    
                    content.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            if (e.ctrlKey) {
                                e.preventDefault();
                                if (e.target.textContent !== node.text) {
                                    this.updateNodeText(node.id, e.target.textContent);
                                } else {
                                    this.editingNodeId = null;
                                    e.target.blur();
                                }
                            }
                        }
                        if (e.key === 'Escape') {
                            e.preventDefault();
                            this.editingNodeId = null;
                            e.target.blur();
                        }
                    });
                    
                    content.addEventListener('input', (e) => {
                        node.text = e.target.textContent;
                        this.reLayout();
                    });
                    
                    div.appendChild(checkbox);
                    div.appendChild(content);
                    
                    div.addEventListener('click', (e) => {
                        if (e.target !== checkbox && e.target !== content) {
                            e.stopPropagation();
                            this.selectNode(node.id);
                        }
                    });
                    
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.showContextMenu(node.id, e.clientX, e.clientY);
                    });
                    
                    console.log('Node element created successfully:', div.outerHTML);
                    return div;
                } catch (error) {
                    console.error('Error in createNodeElement:', error);
                    return null;
                }
            }
            
            renderConnection(parentId, childId) {
                try {
                    const parent = this.nodes.find(n => n.id === parentId);
                    const child = this.nodes.find(n => n.id === childId);
                    
                    if (!parent || !child) return;
                    
                    const connections = document.getElementById('connections');
                    if (!connections) return;
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    let startX, startY, endX, endY;
                    
                    if (this.layoutType === 'right') {
                        startX = parent.x + 150;
                        startY = parent.y + 17;
                        endX = child.x + 8;
                        endY = child.y + 17;
                    } else {
                        startX = parent.x + 75;
                        startY = parent.y + 35;
                        endX = child.x + 75;
                        endY = child.y + 8;
                    }
                    
                    let pathData = '';
                    
                    if (this.connectionStyle === 'curve') {
                        if (this.layoutType === 'right') {
                            const controlX1 = startX + (endX - startX) / 2;
                            const controlY1 = startY;
                            const controlX2 = startX + (endX - startX) / 2;
                            const controlY2 = endY;
                            pathData = `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;
                        } else {
                            const controlX1 = startX;
                            const controlY1 = startY + (endY - startY) / 2;
                            const controlX2 = endX;
                            const controlY2 = endY - (endY - startY) / 2;
                            pathData = `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;
                        }
                    } else if (this.connectionStyle === 'right-angle') {
                        if (this.layoutType === 'right') {
                            const midX = (startX + endX) / 2;
                            pathData = `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`;
                        } else {
                            const midY = (startY + endY) / 2;
                            pathData = `M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`;
                        }
                    } else {
                        pathData = `M ${startX} ${startY} L ${endX} ${endY}`;
                    }
                    
                    path.setAttribute('d', pathData);
                    path.setAttribute('class', 'connection-line');
                    connections.appendChild(path);
                } catch (error) {
                    console.error('Error in renderConnection:', error);
                }
            }
            
            renderAllConnections() {
                try {
                    const connections = document.getElementById('connections');
                    if (!connections) return;
                    
                    connections.innerHTML = '';
                    
                    const nodeHeight = 35;
                    const lineGap = 5;
                    
                    const parentNodes = this.nodes.filter(n => n.children.length > 0);
                    
                    parentNodes.forEach(parent => {
                        const childNodes = parent.children
                            .map(childId => this.nodes.find(n => n.id === childId))
                            .filter(n => n);
                        
                        if (childNodes.length === 0) return;
                        
                        const parentActualWidth = parent.actualWidth || 100;
                        const parentRightX = parent.x + parentActualWidth + lineGap;
                        const parentCenterY = parent.y + nodeHeight / 2;
                        
                        if (childNodes.length === 1) {
                            const child = childNodes[0];
                            const childLeftX = child.x - lineGap;
                            const childCenterY = child.y + nodeHeight / 2;
                            
                            this.drawSingleConnection(
                                connections,
                                parentRightX, parentCenterY,
                                childLeftX, childCenterY
                            );
                        } else {
                            childNodes.sort((a, b) => a.y - b.y);
                            
                            const firstChildY = childNodes[0].y + nodeHeight / 2;
                            const lastChildY = childNodes[childNodes.length - 1].y + nodeHeight / 2;
                            
                            const firstChildLeftX = childNodes[0].x - lineGap;
                            
                            const verticalLineX = firstChildLeftX;
                            
                            this.drawLine(connections, parentRightX, parentCenterY, verticalLineX, parentCenterY);
                            
                            this.drawLine(connections, verticalLineX, firstChildY, verticalLineX, lastChildY);
                            
                            childNodes.forEach(child => {
                                const childCenterY = child.y + nodeHeight / 2;
                                const childLeftX = child.x - lineGap;
                                
                                this.drawLine(connections, verticalLineX, childCenterY, childLeftX, childCenterY);
                            });
                        }
                    });
                } catch (error) {
                    console.error('Error in renderAllConnections:', error);
                }
            }
            
            drawLine(connections, x1, y1, x2, y2) {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const pathData = `M ${x1} ${y1} L ${x2} ${y2}`;
                path.setAttribute('d', pathData);
                path.setAttribute('class', 'connection-line');
                connections.appendChild(path);
            }
            
            drawSingleConnection(connections, x1, y1, x2, y2) {
                const midX = (x1 + x2) / 2;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const pathData = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
                path.setAttribute('d', pathData);
                path.setAttribute('class', 'connection-line');
                connections.appendChild(path);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded fired');
            try {
                const mindMap = new MindMap();
                console.log('MindMap instance created');
            } catch (error) {
                console.error('Error creating MindMap:', error);
            }
        });
    </script>
</body>
