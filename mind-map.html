<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思维导图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            overflow: auto;
        }
        
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .toolbar button {
            padding: 6px 12px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .toolbar button:hover {
            background-color: #e8e8e8;
        }
        
        .toolbar button:active {
            background-color: #d9d9d9;
        }
        
        .toolbar select {
            padding: 6px 12px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;
        }
        
        .mind-map-container {
            margin-top: 60px;
            padding: 20px;
            min-height: calc(100vh - 60px);
            position: relative;
            overflow: visible;
        }
        
        .mind-map {
            position: relative;
            min-width: 100%;
            min-height: 100%;
        }
        
        .node {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            white-space: nowrap;
            z-index: 10;
        }
        
        .node:hover {
            background-color: #f0f0f0;
        }
        
        .node.selected {
            background-color: #e6f7ff;
            border: 1px solid #1890ff;
        }
        
        .node-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .node-checkbox.checked {
            background-color: #52c41a;
            border-color: #52c41a;
        }
        
        .node-content {
            line-height: 1.5;
            outline: none;
            min-width: 20px;
            min-height: 1.5em;
            cursor: text;
        }
        
        .node-content:focus {
            background-color: #ffffff;
            padding: 2px 4px;
            border-radius: 2px;
            outline: 1px solid #1890ff;
        }
        
        .connections {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .connection-line {
            stroke: #333333;
            stroke-width: 1.5;
            fill: none;
        }
        
        .layout-selector,
        .connection-style-selector,
        .font-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .layout-selector label,
        .connection-style-selector label,
        .font-selector label {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        
        .empty-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #999999;
            text-align: center;
        }
        
        .context-menu {
            position: fixed;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 2000;
            min-width: 120px;
            display: none;
        }
        
        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .context-menu-item:last-child {
            border-bottom: none;
        }
        
        .context-menu-item:hover {
            background-color: #f5f5f5;
        }
        
        .context-menu-item.delete-item {
            color: #ff4d4f;
        }
        
        .context-menu-item.delete-item:hover {
            background-color: #fff2f0;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="addCenterNode">添加中心节点</button>
        <div class="layout-selector">
            <label for="layoutSelect">布局：</label>
            <select id="layoutSelect">
                <option value="right">右向布局</option>
                <option value="tree">树状图布局</option>
            </select>
        </div>
        <div class="connection-style-selector">
            <label for="connectionStyleSelect">连线：</label>
            <select id="connectionStyleSelect">
                <option value="curve">曲线</option>
                <option value="right-angle">直角</option>
                <option value="straight">直线</option>
            </select>
        </div>
        <div class="font-selector">
            <label for="fontSelect">字体：</label>
            <select id="fontSelect">
                <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">默认</option>
                <option value="'Microsoft YaHei', '微软雅黑', sans-serif">微软雅黑</option>
                <option value="'SimSun', '宋体', serif">宋体</option>
                <option value="'KaiTi', '楷体', serif">楷体</option>
                <option value="'SimHei', '黑体', sans-serif">黑体</option>
                <option value="'Arial', sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Georgia', serif">Georgia</option>
                <option value="'Verdana', sans-serif">Verdana</option>
            </select>
        </div>
    </div>
    
    <div class="mind-map-container">
        <div class="mind-map" id="mindMap">
            <svg class="connections" id="connections"></svg>
        </div>
    </div>
    
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="addChildMenuItem">添加子节点</div>
        <div class="context-menu-item delete-item" id="deleteMenuItem">删除</div>
    </div>

    <script>
        class MindMap {
            constructor() {
                this.nodes = [];
                this.layoutType = 'right';
                this.connectionStyle = 'curve';
                this.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
                this.nextNodeId = 1;
                this.selectedNodeId = null;
                this.editingNodeId = null;
                this.contextMenuNodeId = null;
                
                this.init();
            }
            
            init() {
                document.getElementById('addCenterNode').addEventListener('click', () => this.addCenterNode());
                document.getElementById('layoutSelect').addEventListener('change', (e) => {
                    this.layoutType = e.target.value;
                    this.render();
                });
                document.getElementById('connectionStyleSelect').addEventListener('change', (e) => {
                    this.connectionStyle = e.target.value;
                    this.render();
                });
                document.getElementById('fontSelect').addEventListener('change', (e) => {
                    this.fontFamily = e.target.value;
                    this.render();
                });
                
                document.getElementById('mindMap').addEventListener('click', (e) => {
                    if (e.target.id === 'mindMap' || e.target.tagName === 'svg' || e.target.tagName === 'path') {
                        this.deselectAll();
                    }
                });
                
                document.getElementById('addChildMenuItem').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.contextMenuNodeId) {
                        this.addChildNode(this.contextMenuNodeId);
                    }
                    this.hideContextMenu();
                });
                
                document.getElementById('deleteMenuItem').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.contextMenuNodeId) {
                        this.deleteNode(this.contextMenuNodeId);
                    }
                    this.hideContextMenu();
                });
                
                document.addEventListener('click', () => {
                    this.hideContextMenu();
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.hideContextMenu();
                    }
                });
                
                this.render();
            }
            
            addCenterNode() {
                const id = this.nextNodeId++;
                const node = {
                    id,
                    text: '中心节点',
                    x: 100,
                    y: 100,
                    children: [],
                    isCenter: true,
                    checked: false,
                    parentId: null
                };
                this.nodes.push(node);
                this.render();
            }
            
            addChildNode(parentId) {
                const parentNode = this.nodes.find(n => n.id === parentId);
                if (!parentNode) return;
                
                const id = this.nextNodeId++;
                const node = {
                    id,
                    text: '子节点',
                    x: 0,
                    y: 0,
                    children: [],
                    isCenter: false,
                    checked: false,
                    parentId
                };
                
                this.nodes.push(node);
                parentNode.children.push(id);
                this.render();
            }
            
            deleteNode(nodeId) {
                const node = this.nodes.find(n => n.id === nodeId);
                if (!node) return;
                
                const deleteRecursive = (id) => {
                    const currentNode = this.nodes.find(n => n.id === id);
                    if (currentNode) {
                        currentNode.children.forEach(childId => deleteRecursive(childId));
                        if (currentNode.parentId) {
                            const parent = this.nodes.find(n => n.id === currentNode.parentId);
                            if (parent) {
                                parent.children = parent.children.filter(cId => cId !== id);
                            }
                        }
                        this.nodes = this.nodes.filter(n => n.id !== id);
                    }
                };
                
                deleteRecursive(nodeId);
                this.render();
            }
            
            updateNodeText(nodeId, text) {
                const node = this.nodes.find(n => n.id === nodeId);
                if (node) {
                    node.text = text;
                    this.editingNodeId = null;
                    this.render();
                }
            }
            
            toggleNodeChecked(nodeId) {
                const node = this.nodes.find(n => n.id === nodeId);
                if (node) {
                    node.checked = !node.checked;
                    this.render();
                }
            }
            
            selectNode(nodeId) {
                this.selectedNodeId = nodeId;
                this.render();
            }
            
            deselectAll() {
                this.selectedNodeId = null;
                this.editingNodeId = null;
                this.render();
            }
            
            startEditing(nodeId) {
                this.editingNodeId = nodeId;
                this.selectedNodeId = nodeId;
                this.render();
                
                setTimeout(() => {
                    const contentElement = document.querySelector(`[data-node-id="${nodeId}"] .node-content`);
                    if (contentElement) {
                        contentElement.focus();
                        const range = document.createRange();
                        range.selectNodeContents(contentElement);
                        const selection = window.getSelection();
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                }, 10);
            }
            
            showContextMenu(nodeId, x, y) {
                this.contextMenuNodeId = nodeId;
                const contextMenu = document.getElementById('contextMenu');
                
                const menuWidth = 120;
                const menuHeight = 82;
                
                let menuX = x;
                let menuY = y;
                
                if (menuX + menuWidth > window.innerWidth) {
                    menuX = window.innerWidth - menuWidth - 10;
                }
                if (menuY + menuHeight > window.innerHeight) {
                    menuY = window.innerHeight - menuHeight - 10;
                }
                
                contextMenu.style.left = `${menuX}px`;
                contextMenu.style.top = `${menuY}px`;
                contextMenu.style.display = 'block';
            }
            
            hideContextMenu() {
                const contextMenu = document.getElementById('contextMenu');
                contextMenu.style.display = 'none';
                this.contextMenuNodeId = null;
            }
            
            calculateLayout() {
                if (this.nodes.length === 0) return;
                
                this.nodes.forEach(node => {
                    node.x = 0;
                    node.y = 0;
                });
                
                if (this.layoutType === 'right') {
                    this.calculateRightLayout();
                } else {
                    this.calculateTreeLayout();
                }
            }
            
            calculateRightLayout() {
                const centerNodes = this.nodes.filter(n => n.isCenter);
                const nodeHeight = 35;
                const levelWidth = 250;
                const verticalGap = 20;
                
                const getSubtreeHeight = (nodeId) => {
                    const node = this.nodes.find(n => n.id === nodeId);
                    if (!node || node.children.length === 0) return nodeHeight;
                    
                    let totalHeight = 0;
                    node.children.forEach(childId => {
                        totalHeight += getSubtreeHeight(childId) + verticalGap;
                    });
                    totalHeight -= verticalGap;
                    
                    return Math.max(nodeHeight, totalHeight);
                };
                
                let currentY = 50;
                
                const layoutRightSubtree = (nodeId, level, startY, allocatedHeight) => {
                    const node = this.nodes.find(n => n.id === nodeId);
                    if (!node) return startY;
                    
                    node.x = 100 + level * levelWidth;
                    
                    if (node.children.length === 0) {
                        node.y = startY;
                        return startY + nodeHeight;
                    } else {
                        let childrenTotalHeight = 0;
                        node.children.forEach(childId => {
                            childrenTotalHeight += getSubtreeHeight(childId) + verticalGap;
                        });
                        childrenTotalHeight -= verticalGap;
                        
                        const availableHeight = Math.max(nodeHeight, childrenTotalHeight);
                        node.y = startY + (availableHeight - nodeHeight) / 2;
                        
                        let childY = startY;
                        node.children.forEach(childId => {
                            const childSubtreeHeight = getSubtreeHeight(childId);
                            layoutRightSubtree(childId, level + 1, childY, childSubtreeHeight);
                            childY += childSubtreeHeight + verticalGap;
                        });
                        
                        return startY + availableHeight;
                    }
                };
                
                centerNodes.forEach(centerNode => {
                    const subtreeHeight = getSubtreeHeight(centerNode.id);
                    layoutRightSubtree(centerNode.id, 0, currentY, subtreeHeight);
                    currentY += subtreeHeight + 40;
                });
            }
            
            calculateTreeLayout() {
                const centerNodes = this.nodes.filter(n => n.isCenter);
                const nodeHeight = 35;
                const levelHeight = 100;
                const horizontalGap = 30;
                
                const getSubtreeWidth = (nodeId) => {
                    const node = this.nodes.find(n => n.id === nodeId);
                    if (!node || node.children.length === 0) {
                        return 150;
                    }
                    
                    let totalWidth = 0;
                    node.children.forEach(childId => {
                        totalWidth += getSubtreeWidth(childId) + horizontalGap;
                    });
                    totalWidth -= horizontalGap;
                    
                    return Math.max(150, totalWidth);
                };
                
                const layoutTreeSubtree = (nodeId, level, startX, allocatedWidth) => {
                    const node = this.nodes.find(n => n.id === nodeId);
                    if (!node) return startX;
                    
                    node.y = 50 + level * levelHeight;
                    
                    if (node.children.length === 0) {
                        node.x = startX + (allocatedWidth - 150) / 2;
                        return startX + allocatedWidth;
                    } else {
                        let childrenTotalWidth = 0;
                        node.children.forEach(childId => {
                            childrenTotalWidth += getSubtreeWidth(childId) + horizontalGap;
                        });
                        childrenTotalWidth -= horizontalGap;
                        
                        const availableWidth = Math.max(150, childrenTotalWidth);
                        node.x = startX + (availableWidth - 150) / 2;
                        
                        let childX = startX;
                        node.children.forEach(childId => {
                            const childSubtreeWidth = getSubtreeWidth(childId);
                            layoutTreeSubtree(childId, level + 1, childX, childSubtreeWidth);
                            childX += childSubtreeWidth + horizontalGap;
                        });
                        
                        return startX + availableWidth;
                    }
                };
                
                let currentX = 50;
                centerNodes.forEach(centerNode => {
                    const subtreeWidth = getSubtreeWidth(centerNode.id);
                    layoutTreeSubtree(centerNode.id, 0, currentX, subtreeWidth);
                    currentX += subtreeWidth + 150;
                });
            }
            
            render() {
                const mindMap = document.getElementById('mindMap');
                const connections = document.getElementById('connections');
                
                this.calculateLayout();
                
                const existingNodes = mindMap.querySelectorAll('.node');
                existingNodes.forEach(node => node.remove());
                
                connections.innerHTML = '';
                
                let maxX = 0;
                let maxY = 0;
                this.nodes.forEach(node => {
                    maxX = Math.max(maxX, node.x + 400);
                    maxY = Math.max(maxY, node.y + 200);
                });
                
                const containerWidth = Math.max(maxX, window.innerWidth - 40);
                const containerHeight = Math.max(maxY, window.innerHeight - 80);
                
                mindMap.style.width = `${containerWidth}px`;
                mindMap.style.height = `${containerHeight}px`;
                connections.setAttribute('width', containerWidth);
                connections.setAttribute('height', containerHeight);
                connections.style.width = `${containerWidth}px`;
                connections.style.height = `${containerHeight}px`;
                
                this.nodes.forEach(node => {
                    const nodeElement = this.createNodeElement(node);
                    mindMap.appendChild(nodeElement);
                });
                
                this.nodes.forEach(node => {
                    if (node.parentId) {
                        this.renderConnection(node.parentId, node.id);
                    }
                });
                
                if (this.nodes.length === 0) {
                    const emptyMessage = document.createElement('div');
                    emptyMessage.className = 'empty-message';
                    emptyMessage.textContent = '点击"添加中心节点"开始创建思维导图';
                    mindMap.appendChild(emptyMessage);
                }
            }
            
            createNodeElement(node) {
                const div = document.createElement('div');
                div.className = `node ${this.selectedNodeId === node.id ? 'selected' : ''}`;
                div.style.left = `${node.x}px`;
                div.style.top = `${node.y}px`;
                div.dataset.nodeId = node.id;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = `node-checkbox ${node.checked ? 'checked' : ''}`;
                checkbox.checked = node.checked;
                checkbox.addEventListener('change', (e) => {
                    e.stopPropagation();
                    this.toggleNodeChecked(node.id);
                });
                
                const content = document.createElement('div');
                content.className = 'node-content';
                content.textContent = node.text;
                content.contentEditable = 'true';
                content.style.fontFamily = this.fontFamily;
                content.style.fontSize = '16px';
                
                content.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    this.startEditing(node.id);
                });
                
                content.addEventListener('click', (e) => {
                    if (this.editingNodeId !== node.id) {
                        e.stopPropagation();
                    }
                });
                
                content.addEventListener('blur', (e) => {
                    if (e.target.textContent.trim() !== node.text) {
                        this.updateNodeText(node.id, e.target.textContent.trim());
                    } else {
                        this.editingNodeId = null;
                    }
                });
                
                content.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (e.target.textContent.trim() !== node.text) {
                            this.updateNodeText(node.id, e.target.textContent.trim());
                        } else {
                            this.editingNodeId = null;
                            e.target.blur();
                        }
                    }
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        this.editingNodeId = null;
                        e.target.blur();
                    }
                });
                
                div.appendChild(checkbox);
                div.appendChild(content);
                
                div.addEventListener('click', (e) => {
                    if (e.target !== checkbox && e.target !== content) {
                        e.stopPropagation();
                        this.selectNode(node.id);
                    }
                });
                
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.showContextMenu(node.id, e.clientX, e.clientY);
                });
                
                return div;
            }
            
            renderConnection(parentId, childId) {
                const parent = this.nodes.find(n => n.id === parentId);
                const child = this.nodes.find(n => n.id === childId);
                
                if (!parent || !child) return;
                
                const connections = document.getElementById('connections');
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                
                let startX, startY, endX, endY;
                
                if (this.layoutType === 'right') {
                    startX = parent.x + 150;
                    startY = parent.y + 17;
                    endX = child.x + 8;
                    endY = child.y + 17;
                } else {
                    startX = parent.x + 75;
                    startY = parent.y + 35;
                    endX = child.x + 75;
                    endY = child.y + 8;
                }
                
                let pathData = '';
                
                if (this.connectionStyle === 'curve') {
                    if (this.layoutType === 'right') {
                        const controlX1 = startX + (endX - startX) / 2;
                        const controlY1 = startY;
                        const controlX2 = startX + (endX - startX) / 2;
                        const controlY2 = endY;
                        pathData = `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;
                    } else {
                        const controlX1 = startX;
                        const controlY1 = startY + (endY - startY) / 2;
                        const controlX2 = endX;
                        const controlY2 = endY - (endY - startY) / 2;
                        pathData = `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;
                    }
                } else if (this.connectionStyle === 'right-angle') {
                    if (this.layoutType === 'right') {
                        const midX = (startX + endX) / 2;
                        pathData = `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`;
                    } else {
                        const midY = (startY + endY) / 2;
                        pathData = `M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`;
                    }
                } else {
                    pathData = `M ${startX} ${startY} L ${endX} ${endY}`;
                }
                
                path.setAttribute('d', pathData);
                path.setAttribute('class', 'connection-line');
                connections.appendChild(path);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new MindMap();
        });
    </script>
</body>
</html>
